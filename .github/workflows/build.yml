name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15  # Apple Silicon; keep the runner generation explicit.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Test behavior, preferences, local bridge and shaders
        run: ./scripts/test.sh
      - name: Test Chipmunk multi-body motion
        run: bash scripts/test-orbital.sh
      - name: Build Apple Silicon application
        run: ./build.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/奇点.app
      - name: Test capture recovery policy without screen access
        run: dist/奇点.app/Contents/MacOS/Singularity --capture-policy-test
      - name: Ensure native QA is absent from the signed product
        run: ./scripts/check-release-isolation.sh
  release:
    needs: macos
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: ./scripts/release-tag.sh --check-tag
      - name: Package with the release environment's signing identity
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?Missing release certificate}" "${P12_PASSWORD:?Missing certificate password}"
          umask 077
          keychain="$RUNNER_TEMP/singularity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          p12=$(mktemp "$RUNNER_TEMP/identity.XXXXXX")
          trap 'rm -f "$p12"; security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 -D > "$p12"
          security import "$p12" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          rm -f "$p12"; unset P12_BASE64 P12_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/^[[:space:]]*[0-9]+\)/ {print $2}')
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || { echo 'Expected exactly one valid signing certificate' >&2; exit 1; }
          SINGULARITY_SIGNING_KEYCHAIN="$keychain" SINGULARITY_SIGNING_IDENTITY="$identity" ./scripts/package.sh
      - name: Verify team, version and asset digests; publish without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: ./scripts/release-tag.sh
