name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15  # Apple Silicon; keep the runner generation explicit.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Test behavior, preferences, local bridge and shaders
        run: ./scripts/test.sh
      - name: Test Chipmunk multi-body motion
        run: bash scripts/test-orbital.sh
      - name: Build Apple Silicon application
        run: ./build.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/奇点.app
      - name: Test capture recovery policy without screen access
        run: dist/奇点.app/Contents/MacOS/Singularity --capture-policy-test
